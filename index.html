<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>بازی پازل کلمات</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Basic styles to ensure portrait orientation and full screen canvas */
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
            font-family: 'Vazirmatn', sans-serif; /* Apply Vazirmatn to body */
        }
        canvas {
            display: block;
            /* Ensure canvas stays within portrait aspect ratio if Kaboom doesn't handle it directly */
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain; /* Scale down to fit if necessary */
        }
    </style>
        <script src="https://unpkg.com/kaboom@3000.1.17/dist/kaboom.js"></script>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script src="levels.js"></script>
    <script src="game.js"></script>
</body>
</html>
